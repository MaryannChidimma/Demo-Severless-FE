# Serves the built storefront and forwards /api to the backend's API gateway
# (k8s/api-gateway.yaml in the backend repository). The gateway owns the
# routing to the three services, the retries and the per-service timeouts;
# this file only knows one backend address.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api-gateway;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    # Longer than the gateway's own worst case (two tries of 2 s + 10 s)
    proxy_read_timeout 30s;
    # Only when the gateway itself is unreachable; its own JSON errors pass through
    error_page 502 503 504 = @api_unavailable;
  }

  location @api_unavailable {
    default_type application/problem+json;
    return 503 '{"title":"Service Unavailable","status":503,"detail":"This part of the shop is restarting. Try again in a moment."}';
  }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Client-side routes
  location / { try_files $uri /index.html; }
}
