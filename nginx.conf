# Serves the built storefront and forwards /api to the three services, the
# same routing the Vite dev server does. Hostnames match the service names
# in the backend's docker-compose.yml and k8s manifests.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/users    { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://user-service:8081; }
  location /api/products { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://product-service:8082; }
  location /api/carts    { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://order-service:8083; }
  location /api/orders   { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://order-service:8083; }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Client-side routes
  location / { try_files $uri /index.html; }
}
